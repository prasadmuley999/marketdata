name: NSE File Downloader & Dashboard Builder

on:
  schedule:
    # Runs at 14:30 UTC (8:00 PM IST) Monday to Friday
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Allows you to manually click "Run workflow"

permissions:
  contents: write # Allows saving downloaded files and index.html back to the repo

jobs:
  download_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with Pip Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Automatically caches and restores pip dependencies
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Current Date (IST)
        run: |
          echo "DATE_STR=$(TZ='Asia/Kolkata' date +'%d%m%Y')" >> $GITHUB_ENV

      - name: Download NSE File
        id: download_file
        run: |
          mkdir -p reports
          if curl -sSfL -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://archives.nseindia.com/archives/equities/mto/MTO_${{ env.DATE_STR }}.DAT" \
            -o "reports/MTO_${{ env.DATE_STR }}.DAT"; then
            echo "download_status=success" >> $GITHUB_OUTPUT
          else
            echo "Download failed. Likely a trading holiday or the file has not been uploaded yet."
            echo "download_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Retain Only Latest 7 Files
        if: steps.download_file.outputs.download_status == 'success'
        run: |
          files_to_delete=$(ls -1t reports/MTO_*.DAT 2>/dev/null | tail -n +8)
          if [ -n "$files_to_delete" ]; then
            echo "$files_to_delete" | xargs rm -f
          fi

      - name: Generate Dashboard HTML
        if: steps.download_file.outputs.download_status == 'success'
        run: |
          python generate_dashboard.py

      - name: Commit and Push to Repository
        if: steps.download_file.outputs.download_status == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage download reports, deleted records, and the new index.html file
          git add reports/ index.html
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NSE data & build dashboard" && git push)
