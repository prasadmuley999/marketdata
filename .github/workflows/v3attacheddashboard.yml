name: v3 NSE File Downloader & Dashboard Builder

on:
  schedule:
    # Runs at 14:42 UTC (8:12 PM IST) every single day of the week
    - cron: '42 14 * * *'
  workflow_dispatch: # Allows manual run
  
permissions:
  contents: write # Allows GitHub to save the downloaded files and index.html back to your repo

jobs:
  download_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with Pip Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Reports, Generate Dashboard and Send Email
        env:
          # Passes repository secrets directly to the Python runtime
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python generate_dashboard.py

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage download reports, deleted records, and the new index.html file
          git add reports/ index.html
          
          # Only commits if there are actual updates
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NSE data & build dashboard" && git push)
