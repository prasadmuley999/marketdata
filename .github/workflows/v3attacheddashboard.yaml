name: NSE File Downloader & Dashboard Builder

on:
  schedule:
    # Runs at 14:30 UTC (8:00 PM IST) Monday to Friday
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Allows manual run

permissions:
  contents: write # Saves files back to your repository

jobs:
  download_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with Pip Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Reports and Generate Dashboard
        run: |
          python generate_dashboard.py

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add reports/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NSE data & build dashboard" && git push)
